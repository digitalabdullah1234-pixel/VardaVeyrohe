<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#121116;--cream:#f4efe8;--grape:#c96ee8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.fn{font-family:'Inter',system-ui,sans-serif}
.sl{max-width:1920px;margin:0 auto}
.stage{position:relative;container-type:inline-size;display:flex;flex-wrap:wrap;justify-content:space-around;align-items:center;row-gap:26px;padding:40px 18px}
#top .stage{min-height:100svh;align-content:center;padding-top:96px}
.e{box-sizing:border-box;margin:0;width:calc(var(--m,100)*1%);max-width:100%;transition:opacity .9s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*70ms),translate .9s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*70ms),transform .6s cubic-bezier(.2,.7,.2,1)}
.e.a{width:auto}
.e>img{display:block;width:100%;height:auto}
.js .sl:not(.on) .e{opacity:0;translate:0 28px}
.ph:hover{transform:scale(1.03) rotate(-1.2deg)}
.lk{margin-left:auto}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(6deg)}}
.t{font-size:clamp(15.5px,4.5vw,19px);line-height:1.5;text-align:justify;hyphens:auto}
.t p{margin:0}.t.b{font-weight:800;letter-spacing:-.012em}.t.r{font-weight:400}
.a.t{text-align:left;font-family:'Inter',system-ui,sans-serif;white-space:nowrap}
a.e{color:inherit;text-decoration:none}a.e:hover{color:var(--grape)}
.st{display:flex;align-items:flex-start;gap:calc(var(--g)*1em);font-size:clamp(14px,4vw,17px)}
.st>img{flex:none;max-width:none}.st .lb{margin:.45em 0 0;line-height:1.2;font-weight:400;font-size:1em}.st img{display:block;max-width:none}
.co{border-top:1px solid rgba(244,239,232,.16);padding-top:18px;font-size:clamp(15.5px,4.4vw,18px)}
.co .hb{display:flex;align-items:center;margin-bottom:.7em}.co .hb img{display:block;height:auto}
.co .rw{display:flex;justify-content:space-between;font-size:1.2em;line-height:1.2}
.co .cp{margin:.8em 0 0;line-height:1.35;text-align:justify;font-weight:400}
.bt{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center;font:500 clamp(14px,3.8vw,16px)/1 'Inter',sans-serif}
.bt a{display:inline-block;border-radius:999px;padding:.95em 1.7em;text-decoration:none;transition:.25s}
.bt a:first-child{background:var(--grape);color:#121217}.bt a:first-child:hover{background:var(--cream)}
.bt a+a{border:1px solid rgba(244,239,232,.4);color:var(--cream)}.bt a+a:hover{border-color:var(--grape);color:var(--grape)}
.ln,.d{display:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--grape);outline-offset:4px;border-radius:6px}
@media(min-width:900px){
 .stage{display:block;aspect-ratio:16/9;padding:0}
 #top .stage{min-height:0}
 .e{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--w)*1%);max-width:none}
 .e.a{width:auto}.d{display:block}.ln{display:block;height:1px;background:var(--cream);opacity:.85}
 .t{font-size:calc(var(--fs)*1cqw);line-height:var(--lh)}
 .a.t{font-size:calc(var(--fs)*1cqw)}
 .e.cy{top:calc(var(--y)*1% - .62em)}
 .st{font-size:calc(var(--fs)*1cqw)}
 .co{border:0;padding:0;font-size:calc(var(--fs)*1cqw)}
 .co .hb{min-height:calc(var(--bh)*1em);margin:0}.co .rw{margin-top:.15em}.co .cp{margin-top:1.7em;line-height:1.32}
 .bt{font-size:1.05cqw;justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){.fl{animation:none}.e{transition:none}html{scroll-behavior:auto}}
</style>

function Slide({s,i}){
  const r=useRef(null);const[on,setOn]=useState(i===0);
  useEffect(()=>{
    if(on)return;
    if(!('IntersectionObserver' in window)){setOn(true);return}
    const o=new IntersectionObserver(([x])=>{if(x.isIntersecting){setOn(true);o.disconnect()}},{threshold:.12});
    o.observe(r.current);return()=>o.disconnect();
  },[]);
  return h`<section id=${s.id} ref=${r} className=${'sl '+(on?'on':'')}><div className="stage">${s.els.map((e,j)=>h`<${El} key=${j} e=${e} i=${j}/>`)}</div></section>`;
}
